<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A股分析工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <div>
    <h1>📈 A股分析工具</h1>
    <div class="subtitle">实时行情 · 四维评分 · 条件筛选</div>
  </div>
  <div class="header-right">
    <button id="accountBadge" onclick="openAccountModal()" title="点击管理账号">
      <span id="accountIcon">👤</span>
      <span id="accountLabel">未登录</span>
    </button>
  </div>
</div>

<div class="container">

  <div class="market-tabs">
    <button class="market-tab" id="tabBtnAnalyze" onclick="switchMainTab('analyze')">🔍 单股分析</button>
    <button class="market-tab active" id="tabBtnWatchlist" onclick="switchMainTab('watchlist')">⭐ 自选股</button>
    <button class="market-tab" id="tabBtnHoldings" onclick="switchMainTab('holdings')">💼 持仓管理</button>
    <button class="market-tab" id="tabBtnScan" onclick="switchMainTab('scan')">🌐 全市场扫描</button>
    <button class="market-tab" id="tabBtnScreener" onclick="switchMainTab('screener')">🎯 条件筛选</button>
    <button class="market-tab" id="tabBtnAsset" onclick="switchMainTab('asset')">📊 资产分析</button>
    <button class="market-tab" id="tabBtnIpo" onclick="switchMainTab('ipo')">🆕 打新日历</button>
  </div>

  <!-- 单股分析 -->
  <div class="card" id="analyzeCard" style="display:none;">
    <div class="card-title">🔍 单股分析</div>
    <div class="input-group">
      <div class="input-wrap" style="flex:1; min-width:250px;">
        <input type="text" id="stockCode" placeholder="输入股票代码或名称，如 600519 / sh600519 / 贵州茅台">
        <button type="button" class="clear-input" onclick="clearStockInput()" title="清空输入">✕</button>
      </div>
      <button onclick="analyzeStock()">📊 搜索</button>
    </div>
    <div id="analyzeMsg"></div>
    <div id="analyzeResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 股票走势图 -->
  <div class="card" id="chartCard" style="display:none;">
    <div class="card-title">📈 股票走势图 <span id="chartName" style="font-size:13px;color:#6a7a9e;"></span></div>
    <div class="input-group">
      <button class="market-tab chart-tab active" data-period="minute" onclick="loadChart('minute')">分时</button>
      <button class="market-tab chart-tab" data-period="day5" onclick="loadChart('day5')">五日</button>
      <button class="market-tab chart-tab" data-period="day" onclick="loadChart('day')">日K</button>
      <button class="market-tab chart-tab" data-period="week" onclick="loadChart('week')">周K</button>
      <button class="market-tab chart-tab" data-period="month" onclick="loadChart('month')">月K</button>
    </div>
    <div id="chartMsg" style="margin-top:8px;"></div>
    <div id="chartContainer" style="margin-top:8px;"></div>
  </div>

  <!-- 自选股 -->
  <div class="card" id="watchlistCard">
    <div class="card-title">⭐ 自选股</div>
    <div class="input-group">
      <button onclick="loadWatchlist()">📋 刷新</button>
      <!-- <button class="danger" onclick="clearWatchlist()">🗑️ 清空</button> -->
    </div>
    <div id="watchlistResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 持仓管理 -->
  <div class="card" id="holdingsCard" style="display:none;">
    <div class="card-title">💼 持仓管理 <span style="font-size:12px;color:#6a7a9e;">按交易明细自动汇总持仓与盈亏</span></div>
    <div class="input-group">
      <div class="input-wrap" style="flex:0 0 auto; min-width:140px;">
        <input type="text" id="holdStockInput" placeholder="股票代码或名称">
        <button type="button" class="clear-input" onclick="document.getElementById('holdStockInput').value=''" title="清空">✕</button>
      </div>
      <select id="holdTypeInput" style="width:88px;">
        <option value="buy">买入</option>
        <option value="sell">卖出</option>
      </select>
      <input type="datetime-local" id="holdTimeInput" step="1" style="width:200px;" title="交易时间">
      <input type="number" id="holdCostInput" placeholder="交易股价" step="0.01" min="0" style="width:110px;">
      <input type="number" id="holdQtyInput" placeholder="数量(股)" step="1" min="1" style="width:100px;">
      <input type="number" id="holdFeeInput" placeholder="费用" step="0.01" min="0" style="width:80px;">
      <button onclick="addTrade()">➕ 交易</button>
      <button class="secondary" onclick="loadHoldings()">🔄 刷新</button>
      <button class="secondary" onclick="clearHoldInput()">🗑️ 重置</button>
    </div>
    <div id="holdStockHint" style="font-size:13px;color:#6a7a9e;margin:6px 0 8px 2px;"></div>
    <div id="holdingsResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 全市场扫描 -->
  <div class="card" id="scanCard" style="display:none;">
    <div class="card-title">🌐 全市场扫描</div>
    <div class="input-group">
      <button onclick="scanMarket()">🔄 执行扫描</button>
      <button class="secondary" onclick="loadRank('changePercent','desc')">📈 涨幅排行</button>
      <button class="secondary" onclick="loadRank('changePercent','asc')">📉 跌幅排行</button>
      <button class="secondary" onclick="loadRank('turnover','desc')">💧 换手排行</button>
      <span style="color:#6a7a9e;font-size:13px;">返回条数</span>
      <input type="number" id="scanLimit" value="5" min="1" max="100" class="limit-input" title="返回条数">
    </div>
    <div id="scanMsg"></div>
    <div id="scanResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 条件筛选 -->
  <div class="card" id="screenerCard" style="display:none;">
    <div class="card-title">🎯 条件筛选</div>
    <div id="screenerConditions">
      <div class="screener-row">
        <select onchange="updateScreenerField(this)">
          <option value="pe">市盈率(PE)</option>
          <option value="pb">市净率(PB)</option>
          <option value="changePercent">涨跌幅</option>
          <option value="turnover">换手率</option>
          <option value="price">股价</option>
        </select>
        <select>
          <option value="lt">&lt;</option>
          <option value="gt">&gt;</option>
          <option value="eq">=</option>
        </select>
        <input type="text" placeholder="数值" value="20">
        <button class="secondary" onclick="addScreenerRow(this)">+</button>
      </div>
    </div>
    <div class="input-group" style="margin-top:10px;">
      <button onclick="runScreener()">🚀 执行筛选</button>
      <button class="secondary" onclick="presetScreener('dividend')">高股息低估值</button>
      <button class="secondary" onclick="presetScreener('growth')">白马成长</button>
      <button class="secondary" onclick="presetScreener('cashflow')">现金流健康</button>
      <span style="color:#6a7a9e;font-size:13px;">返回条数</span>
      <input type="number" id="screenerLimit" value="5" min="1" max="100" class="limit-input" title="返回条数">
    </div>
    <div id="screenerMsg"></div>
    <div id="screenerResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 资产分析 -->
  <div class="card" id="assetCard" style="display:none;">
    <div class="card-title">📊 资产分析 <span style="font-size:12px;color:#6a7a9e;">按日/周/月/年/历史至今统计盈亏</span></div>
    <div class="input-group">
      <button class="market-tab" id="assetTypeDay" data-type="day" onclick="switchAssetType('day')">日</button>
      <button class="market-tab" id="assetTypeWeek" data-type="week" onclick="switchAssetType('week')">周</button>
      <button class="market-tab" id="assetTypeMonth" data-type="month" onclick="switchAssetType('month')">月</button>
      <button class="market-tab" id="assetTypeYear" data-type="year" onclick="switchAssetType('year')">年</button>
      <button class="market-tab" id="assetTypeAll" data-type="all" onclick="switchAssetType('all')">历史至今</button>
    </div>
    <div id="assetRangeWrap" class="input-group" style="margin-top:10px;flex-wrap:wrap;gap:6px;">
      <input type="date" id="assetDateInput" class="asset-input" style="width:160px;" title="选择日期" onchange="loadAssetAnalysis()">
      <span id="assetRangeLabel" style="color:#6a7a9e;font-size:13px;"></span>
      <button class="secondary" onclick="loadAssetAnalysis()">🔄 刷新</button>
    </div>
    <div id="assetMsg"></div>
    <div id="assetResult" class="result-area" style="display:none;"></div>
  </div>

  <!-- 打新 -->
  <div class="card" id="ipoCard" style="display:none;">
    <div class="card-title">🆕 打新申购</div>
    <div class="input-group">
      <label style="font-size:13px;color:#6a7a9e;display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="ipoShowBond" checked onchange="loadIPO()">显示可转债</label>
      <button onclick="loadIPO()">📋 刷新</button>
    </div>
    <div id="ipoMsg"></div>
    <div id="ipoResult" class="result-area" style="display:none;"></div>
  </div>

</div>

<!-- 账号管理弹窗（功能在 account.html 中实现，此处仅嵌入引用） -->
<div id="accountModal" class="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <b>👤 账号管理</b>
      <button type="button" class="modal-close" onclick="closeAccountModal()" title="关闭">✕</button>
    </div>
    <iframe id="accountFrame" src="account.html" title="账号管理"></iframe>
  </div>
</div>

<script src="./js/app.js"></script>
<script>
// ============ 回车快捷键 ============
document.getElementById('stockCode').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') analyzeStock()
})

// 页面加载时自动加载自选与持股
refreshAccountBadge()
loadWatchlist()
loadHoldings()
document.getElementById('holdTimeInput').value = holdTimeNow()
</script>
</body>
</html>
