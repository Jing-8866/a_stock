<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>账号管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0a0e27; color: #e0e0e0; padding: 12px; font-size: 13px; }
.acct-body { display: flex; flex-direction: column; gap: 10px; }
.msg { font-size: 12px; min-height: 16px; }
.msg.warn { color: #ffb400; }
.msg.ok { color: #00c864; }
.form { display: flex; gap: 6px; flex-wrap: wrap; }
.form input { flex: 1; min-width: 130px; background: #0a0e27; border: 1px solid #2a3a6a; border-radius: 6px; padding: 7px 10px; color: #e0e0e0; font-size: 13px; outline: none; min-height: 34px; }
.form input:focus { border-color: #00d4ff; }
button { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: all .3s; min-height: 34px; white-space: nowrap; }
button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,212,255,.3); }
button:active { transform: translateY(0); }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; align-items: center; gap: 8px; background: #111836; border: 1px solid #1e2d5a; border-radius: 8px; padding: 8px 10px; }
.row.cur { border-color: #00d4ff; }
.row .avatar { font-size: 20px; flex: 0 0 auto; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #16204a; border-radius: 50%; }
.row .info { flex: 1; min-width: 0; }
.row .info .acc { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .info .broker { color: #6a7a9e; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.curtag { color: #00d4ff; font-size: 10px; border: 1px solid #00d4ff; border-radius: 8px; padding: 0 5px; margin-left: 4px; vertical-align: middle; }
.row .profit { flex: 0 0 auto; min-width: 90px; text-align: right; font-size: 13px; }
.pnl.up { color: #ff4646; }
.pnl.down { color: #00c864; }
.row .use { padding: 4px 10px; font-size: 11px; min-height: 28px; }
.row .del { background: linear-gradient(135deg, #ff4757, #cc3344); padding: 4px 10px; font-size: 11px; min-height: 28px; }
.row.cur .use { opacity: .6; cursor: default; transform: none; box-shadow: none; }
.logout { background: linear-gradient(135deg, #ff4757, #cc3344); padding: 4px 12px; font-size: 12px; min-height: 28px; }
.empty { color: #6a7a9e; text-align: center; padding: 24px 0; }
.hint { color: #6a7a9e; font-size: 11px; }
</style>
</head>
<body>
<div class="acct-body">
  <div id="logoutBar" style="display:none;align-items:center;gap:8px;background:#16204a;border:1px solid #1e2d5a;border-radius:8px;padding:8px 10px;">
    <span style="flex:1;color:#e0e6ff;font-size:13px;">当前账号：<b id="logoutBarAccount"></b></span>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
  <div id="msg" class="msg"></div>
  <div class="form">
    <input id="accAccount" placeholder="账号（必填）">
    <input id="accBroker" placeholder="证券公司（必填）">
    <button onclick="addAccount()">➕ 添加账号</button>
  </div>
  <div class="hint">提示：点击【使用】切换当前账号；右侧显示该账号历史至今盈亏。首次添加账号时，原交易明细将迁移到该账号下。</div>
  <div id="acctList"></div>
</div>
<script>
const API = location.origin + '/api'
let accounts = []
let currentAccount = ''
let tradeData = {}

function readS(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb } catch (e) { return fb } }
function saveS(k, v) { localStorage.setItem(k, JSON.stringify(v)) }
function load() {
  accounts = readS('accounts', [])
  currentAccount = readS('currentAccount', '')
  tradeData = readS('tradeData', {})
}
function msg(text, type) {
  const el = document.getElementById('msg')
  el.textContent = text || ''
  el.className = 'msg ' + (type || '')
}
function notify(type) { parent.postMessage({ type: type || 'accountChanged' }, '*') }

function normalizeCode(code) {
  code = String(code || '').trim().toLowerCase()
  if (/^\d{6}$/.test(code)) return code.startsWith('6') ? 'sh' + code : 'sz' + code
  return code
}
function bareCode(code) { return String(code || '').replace(/^(sh|sz|bj)/i, '') }

// 首次添加账号时，迁移旧的全局交易明细（trades / holdings）到该账号下
function migrateLegacy(acc) {
  if (tradeData[acc]) return
  let legacy = null
  try { const t = localStorage.getItem('trades'); if (t) legacy = JSON.parse(t) } catch (e) { /* 忽略 */ }
  if (Array.isArray(legacy) && legacy.length) {
    tradeData[acc] = legacy
  } else {
    try {
      const h = localStorage.getItem('holdings')
      if (h) {
        const arr = JSON.parse(h)
        if (Array.isArray(arr)) {
          tradeData[acc] = arr.map((x, i) => ({
            id: 'mc' + (i + 1) + Date.now().toString(36),
            code: normalizeCode(x.code),
            name: x.name || '',
            type: 'buy',
            price: x.cost || 0,
            qty: x.qty || 0,
            time: x.addedAt || new Date().toISOString()
          })).filter(t => t.price > 0 && t.qty > 0)
        }
      }
    } catch (e) { /* 忽略 */ }
  }
  if (Object.keys(tradeData).length) saveS('tradeData', tradeData)
  localStorage.removeItem('trades')
  localStorage.removeItem('holdings')
}

function addAccount() {
  const acc = document.getElementById('accAccount').value.trim()
  const broker = document.getElementById('accBroker').value.trim()
  if (!acc) { msg('请输入账号', 'warn'); return }
  if (!broker) { msg('请输入证券公司', 'warn'); return }
  load()
  if (accounts.some(a => a.account === acc)) { msg(`账号 ${acc} 已存在，不能重复添加`, 'warn'); return }
  const isFirst = !accounts.length
  accounts.push({ account: acc, broker })
  saveS('accounts', accounts)
  if (isFirst) migrateLegacy(acc)
  document.getElementById('accAccount').value = ''
  document.getElementById('accBroker').value = ''
  msg(`✅ 已添加账号 ${acc}(${broker})`, 'ok')
  render()
  notify('accountChanged')
}

function selectAccount(i) {
  load()
  if (i < 0 || i >= accounts.length) return
  currentAccount = accounts[i].account
  saveS('currentAccount', currentAccount)
  msg(`已切换至账号 ${accounts[i].account}`, 'ok')
  render()
  notify('accountSelected')
}

function removeAccount(i) {
  load()
  if (i < 0 || i >= accounts.length) return
  const a = accounts[i]
  const cnt = (tradeData[a.account] || []).length
  if (!confirm(`确定删除账号 ${a.account}(${a.broker}) 及其 ${cnt} 条交易明细？`)) return
  accounts = accounts.filter(x => x.account !== a.account)
  saveS('accounts', accounts)
  delete tradeData[a.account]
  saveS('tradeData', tradeData)
  if (currentAccount === a.account) { currentAccount = ''; saveS('currentAccount', '') }
  msg(`已删除账号 ${a.account}`, 'ok')
  render()
  notify('accountChanged')
}

// 历史至今盈亏 = Σ(现价×持仓数量 + 卖出金额 - 买入金额)，与持仓管理总收益口径一致
let profitCache = {}
async function calcProfit(acc) {
  if (acc in profitCache) return profitCache[acc]
  const list = (tradeData[acc] || [])
  if (!list.length) { profitCache[acc] = 0; return 0 }
  const groups = {}
  list.forEach(t => {
    const bare = bareCode(t.code)
    if (!groups[bare]) groups[bare] = { code: t.code, name: t.name || '', buyAmt: 0, sellAmt: 0, qty: 0 }
    const g = groups[bare]
    if (t.type === 'sell') { g.sellAmt += t.qty * t.price; g.qty -= t.qty }
    else { g.buyAmt += t.qty * t.price; g.qty += t.qty }
  })
  const items = Object.values(groups)
  let total = items.reduce((s, g) => s + (g.sellAmt - g.buyAmt), 0)
  const hold = items.filter(g => g.qty > 0)
  if (hold.length) {
    try {
      const res = await fetch(`${API}/quote/batch`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codes: hold.map(g => normalizeCode(g.code)) })
      })
      const arr = await res.json()
      const priceMap = {}
      ;(Array.isArray(arr) ? arr : []).forEach(r => { priceMap[bareCode(r.code)] = r.price || 0 })
      hold.forEach(g => { total += (priceMap[bareCode(g.code)] || 0) * g.qty })
    } catch (e) { /* 行情失败按 0 市值计 */ }
  }
  profitCache[acc] = total
  return total
}

// 退出登录：清空当前账号，交易明细保留在该账号下随时可再登录
function logout() {
  load()
  if (!currentAccount) return
  if (!confirm(`确定退出账号 ${currentAccount} 的登录？`)) return
  currentAccount = ''
  saveS('currentAccount', '')
  profitCache = {}
  msg('已退出登录', 'ok')
  render()
  notify('accountChanged')
}

function render() {
  load()
  const listEl = document.getElementById('acctList')
  const logoutBar = document.getElementById('logoutBar')
  const logoutBarAccount = document.getElementById('logoutBarAccount')
  if (logoutBar) {
    if (currentAccount) {
      const a = accounts.find(x => x.account === currentAccount)
      logoutBar.style.display = 'flex'
      if (logoutBarAccount) logoutBarAccount.textContent = a ? currentAccount + '(' + a.broker + ')' : currentAccount
    } else {
      logoutBar.style.display = 'none'
    }
  }
  if (!accounts.length) {
    listEl.innerHTML = '<div class="empty">暂无账号，请先在上方添加</div>'
    return
  }
  listEl.innerHTML = accounts.map((a, i) => `
    <div class="row ${a.account === currentAccount ? 'cur' : ''}">
      <div class="avatar">👤</div>
      <div class="info">
        <div class="acc">${a.account}${a.account === currentAccount ? '<span class="curtag">当前</span>' : ''}</div>
        <div class="broker">${a.broker || ''}</div>
      </div>
      <div class="profit" id="profit-${i}">计算中...</div>
      <button class="use" ${a.account === currentAccount ? 'disabled' : ''} onclick="selectAccount(${i})">${a.account === currentAccount ? '已选择' : '使用'}</button>
      <button class="del" onclick="removeAccount(${i})">删</button>
    </div>`).join('')
  renderAllProfit()
}

async function renderAllProfit() {
  for (let i = 0; i < accounts.length; i++) {
    const el = document.getElementById('profit-' + i)
    if (!el) continue
    try {
      const v = await calcProfit(accounts[i].account)
      el.innerHTML = `<span class="pnl ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(2)}</span>`
    } catch (e) { el.textContent = '--' }
  }
}

document.getElementById('accAccount').addEventListener('keypress', function(e) { if (e.key === 'Enter') addAccount() })
document.getElementById('accBroker').addEventListener('keypress', function(e) { if (e.key === 'Enter') addAccount() })
render()
</script>
</body>
</html>
