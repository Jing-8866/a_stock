<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>localStorage 备份工具</title>
<style>
  body{font-family:-apple-system,"Microsoft YaHei";max-width:680px;margin:40px auto;padding:0 16px;color:#333}
  input{padding:6px 10px;width:320px;font-size:14px}
  button{font-size:14px;padding:6px 14px;margin:6px 4px 6px 0;cursor:pointer}
  .danger{background:#e74c3c;color:#fff;border:none;border-radius:4px}
  .danger:hover{background:#c0392b}
  pre{background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:12px;max-height:260px;overflow:auto;font-size:13px}
  .warn{color:#c0392b;font-size:13px}.ok{color:#27ae60;font-size:13px}
</style>
</head>
<body>

<h2>localStorage 备份 / 恢复</h2>

<p>
  目标域：
  <input id="origin" placeholder="留空=当前页面域，例 http://localhost:7373/">
  <span id="status" class="ok"></span>
</p>

<p>
  <button onclick="doExport()">⬇️ 导出</button>
  <button onclick="document.getElementById('file').click()">⬆️ 导入</button>
  <button onclick="doClear()">🗑️ 清空</button>
  <button onclick="refresh()">🔄 刷新预览</button>
  <input type="file" id="file" accept=".json" style="display:none">
</p>

<p style="margin-top:8px;">
  <label>导入模式：</label>
  <select id="importMode">
    <option value="overwrite">覆盖导入（先清空本地再导入）</option>
    <option value="add">仅新增（本地已有的键不修改）</option>
    <option value="merge" selected>增量Merge（保留本地，导入值按对象深合并/同键覆盖）</option>
  </select>
</p>

<h3>当前可操作 origin：<code id="cur"></code></h3>
<pre id="view"></pre>

<div class="warn" id="hint"></div>

<script>
const curEl = document.getElementById('cur');
const hintEl = document.getElementById('hint');
const statusEl = document.getElementById('status');

function effectiveOrigin(){
  const v = document.getElementById('origin').value.trim();
  return v ? v.replace(/\/+$/,'') : location.origin;
}

function checkSame(){
  const eff = effectiveOrigin();
  curEl.textContent = eff;
  if (eff !== location.origin) {
    hintEl.innerHTML =
      '⚠️ 输入域 <b>' + eff + '</b> 与当前页面域 <b>' + location.origin +
      '</b> <u>不同源</u>。<br>浏览器安全限制：<b>无法跨域读写 localStorage</b>。' +
      '<br>✅ 正确做法：把这个工具页部署到 <b>' + eff + '</b> 下打开，或用该域的 DevTools 执行。';
    statusEl.className='warn'; statusEl.textContent='不同源';
    return false;
  }
  hintEl.textContent = '';
  statusEl.className='ok'; statusEl.textContent='同源 ✔';
  return true;
}

function refresh(){
  if(!checkSame()){ document.getElementById('view').textContent=''; return; }
  const d={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k)}
  document.getElementById('view').textContent = JSON.stringify(d,null,2);
}

function doExport(){
  if(!checkSame()) return;
  const d={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k)}
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const tag = btoa(location.origin).slice(0,8);
  a.download='ls-'+tag+'-'+Date.now()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
}

/* ===== 新增：清空目标域 localStorage ===== */
function doClear(){
  if(!checkSame()) return;

  // 先统计条目，做二次确认
  const keys = [];
  for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));

  if(keys.length === 0){
    alert('当前域的 localStorage 已经是空的。');
    return;
  }

  // 二次确认，防止误删
  const msg = '确定要清空【' + location.origin + '】下的全部 localStorage 吗？\n\n'
            + '共 ' + keys.length + ' 条数据将被删除：\n'
            + keys.slice(0, 10).join('、')
            + (keys.length > 10 ? '\n……（还有 ' + (keys.length-10) + ' 条）' : '');
  if(!confirm(msg)) return;

  // 再次确认（双重保险）
  if(!confirm('此操作不可撤销！确认继续清空？')) return;

  keys.forEach(k => localStorage.removeItem(k));
  alert('已清空 ' + keys.length + ' 条数据。');
  refresh();
}
/* ====================================== */

document.getElementById('file').addEventListener('change',e=>{
  if(!checkSame()) return;
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result);
      const mode = document.getElementById('importMode').value;

      // 覆盖模式风险提示
      if(mode==='overwrite' && !confirm('覆盖导入将先清空当前域全部 localStorage 再写入导入文件内容，不可撤销。确定继续？')) {
        e.target.value=''; refresh(); return;
      }

      const stat = doImport(obj, mode);
      alert('导入完成（'+mode+'）：新增 '+stat.added+' 条，更新 '+stat.updated+' 条，跳过 '+stat.skipped+' 条'
        + (stat.cleared ? '，已清空 '+stat.cleared+' 条原数据' : ''));
      refresh();
    }catch(err){alert('导入失败：'+err.message)}
    e.target.value='';
  };
  r.readAsText(f,'utf-8');
});

function normVal(v){
  // 字符串原样，对象/数组序列化
  return typeof v === 'string' ? v : JSON.stringify(v);
}

function deepMergeValue(lv, iv){
  // 递归深合并：仅当两侧均为纯对象时逐键合并，其余情况用导入值覆盖
  if(lv && iv && typeof lv==='object' && typeof iv==='object' && !Array.isArray(lv) && !Array.isArray(iv)){
    const r = Object.assign({}, lv);
    Object.keys(iv).forEach(k=>{ r[k] = deepMergeValue(lv[k], iv[k]); });
    return r;
  }
  return iv;
}

function mergeStr(key, localStr, importStr){
  // 两侧都是JSON纯对象时深合并；业务数组按键合并；其余情况用导入值
  let l=null, imp=null;
  try{ l = JSON.parse(localStr); }catch(e){ l=null; }
  try{ imp = JSON.parse(importStr); }catch(e){ imp=null; }
  const lObj = l && typeof l==='object' && !Array.isArray(l);
  const iObj = imp && typeof imp==='object' && !Array.isArray(imp);
  if(lObj && iObj){
    const merged = deepMergeValue(l, imp);
    return JSON.stringify(merged);
  }
  const idField = BUSINESS_KEYS[key] || '';
  if(idField && Array.isArray(l) && Array.isArray(imp)){
    return JSON.stringify(mergeBusinessArr(l, imp, idField));
  }
  return importStr; // 字符串或普通值直接用导入的
}

// 业务数组按主键合并：相同主键取导入值并保留本地额外字段，本地独有保留，导入新增追加
function mergeBusinessArr(localArr, importArr, idField){
  const out = [];
  const seen = new Set();
  const push = x => { out.push(x); };
  localArr.forEach(x=>{
    if(x && typeof x==='object' && idField in x){
      if(!seen.has(x[idField])){ seen.add(x[idField]); push(Object.assign({}, x)); }
    } else {
      const k = 'r:' + JSON.stringify(x);
      if(!seen.has(k)){ seen.add(k); push(x); }
    }
  });
  importArr.forEach(x=>{
    if(x && typeof x==='object' && idField in x){
      if(!seen.has(x[idField])){
        seen.add(x[idField]); push(Object.assign({}, x));
      } else {
        const i = out.findIndex(o => o && typeof o==='object' && o[idField]===x[idField]);
        if(i>=0) out[i] = Object.assign({}, out[i], x);
      }
    } else {
      const k = 'r:' + JSON.stringify(x);
      if(!seen.has(k)){ seen.add(k); push(x); }
    }
  });
  return out;
}

const BUSINESS_KEYS = {
  accounts: 'account',
  watchlist: 'code',
  holdings: 'code'
};

function doImport(obj, mode){
  const stat = { added:0, updated:0, skipped:0, cleared:0 };
  if(mode === 'overwrite'){
    // 先清空现有全部
    for(let i=localStorage.length-1;i>=0;i--){ localStorage.removeItem(localStorage.key(i)); stat.cleared++; }
    Object.keys(obj).forEach(k=>{
      localStorage.setItem(k, normVal(obj[k]));
      stat.added++;
    });
    return stat;
  }
  // add / merge
  Object.keys(obj).forEach(k=>{
    const cur = localStorage.getItem(k);
    if(cur === null){
      localStorage.setItem(k, normVal(obj[k]));
      stat.added++;
    } else if(mode === 'merge'){
      const merged = mergeStr(k, cur, normVal(obj[k]));
      if(merged !== cur){ localStorage.setItem(k, merged); stat.updated++; }
      else { stat.skipped++; }
    } else { // add：本地已有键不修改
      stat.skipped++;
    }
  });
  return stat;
}

document.getElementById('origin').addEventListener('input', checkSame);
checkSame(); refresh();
</script>
</body>
</html>
